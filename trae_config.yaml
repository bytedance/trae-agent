agents:
    trae_agent:
        enable_lakeview: true
        model: trae_agent_model
        max_steps: 200
        tools:
            - bash
            - str_replace_based_edit_tool
            - sequentialthinking
            - task_done
            - image_gen
allow_mcp_servers:
    - playwright
mcp_servers:
    playwright:
        command: node
        args:
            - "/Users/zhang/Desktop/tim/trae-agent/node_modules/@playwright/mcp/cli.js"
lakeview:
    model: lakeview_model

model_providers:
    # 火山引擎 Doubao (在线推理, OpenAI 兼容协议)
    # API key 通过环境变量 DOUBAO_API_KEY 设置
    doubao:
        api_key: ""
        provider: doubao
        base_url: https://ark.cn-beijing.volces.com/api/v3
    # 本地 Ollama 模型 (纯本地推理, 不出本机)
    ollama:
        api_key: ollama
        provider: ollama
        base_url: http://localhost:11434/v1
    # MiniMax (OpenAI 兼容协议, 在线推理) - 需设置 MINIMAX_API_KEY 环境变量
    minimax:
        api_key: ""
        provider: minimax
        base_url: https://api.minimax.io/v1
    # NVIDIA NIM (OpenAI 兼容协议, 在线推理) - 需设置 NVIDIA_API_KEY 环境变量
    nvidia:
        api_key: ""
        provider: nvidia
        base_url: https://integrate.api.nvidia.com/v1

models:
    # ===== 默认模型: 火山引擎 Doubao (云端, 质量最优) =====
    trae_agent_model:
        model_provider: doubao
        model: ep-20260723204029-zxn4d
        supports_multimodal: true
        max_tokens: 8192
        temperature: 0.5
        top_p: 0.95
        top_k: 0
        max_retries: 10
        parallel_tool_calls: true
    lakeview_model:
        model_provider: doubao
        model: ep-20260723204029-zxn4d
        supports_multimodal: true
        max_tokens: 4096
        temperature: 0.3
        top_p: 0.9
